openapi: 3.1.0
info:
  title: Emage — JPEG 2000 layer-window server
  description: |
    Marker-only JPEG 2000 codestream server. Parses codestreams without decoding
    and serves DWT resolution windows for progressive loading, plus full-image
    upload with password authentication. "Layers" always means spatial resolution
    levels, counted coarse-first, rather than JPEG 2000 quality layers.

    Crypto-agnostic contract: the server never needs to determine whether an image
    is plaintext or encrypted, and never receives secret keys. It copies generic
    header markers and opaque packet ranges without interpreting encryption.

    Optional caller metadata travels inside a binary COM marker (FF 64) in the
    image's main header, with Rcom=0 and the prefix "EMAGE-META" followed by a NUL
    byte and a UTF-8 JSON object. The metadata response returns that object as
    "metadata", or null when absent or malformed. The server does not interpret
    its fields. No separate metadata file or upload metadata header is used.
    Header-including windows preserve the COM marker verbatim. Clients can use
    opaque lookup fields to select resolution bounds before fetching packets.

    Layer-window protocol:
      - `X-Emage-Layers: n:m`   → packets for layers n..m; header/framing included only when n == 0
      - `X-Emage-Layers: n`     → single layer n (same framing rules)
      - `X-Emage-Layers: all`   → headers + all packets, terminated with EOC (self-contained)
      - `X-Emage-Layers: meta`  → JSON metadata (layers, size)

    A window's main headers are byte-identical to the stored codestream's, COD's
    decomposition count included, because a DWT resolution's pixel geometry is
    derived from SIZ together with that count: renumbering the retained levels
    from 0 would decode a 0:0 window of a 512x512/6-level codestream as 512x512
    instead of 16x16. Every tile-part's Psot is corrected for the shortened body,
    and the offsets of those fields are reported in `X-Emage-TilePsotOffsets`.

    A window with `n == 0` includes the headers and is terminated with EOC, so it
    is a self-contained codestream: the levels it does not carry are absent, and
    a decoder reads it by reducing `NumResolutions - 1 - m` halvings. A window
    with `n > 0` carries packets only, for splicing after the `n == 0` window.
  version: 1.0.0
servers:
  - url: /
paths:
  /image/{path}:
    get:
      operationId: getImage
      summary: Fetch a JPEG 2000 layer window.
      description: |
        Returns a codestream slice for the requested layer window. The slice is a
        valid continuation stream for a progressive decoder; with `all` it is a
        complete, standalone codestream.
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: >-
            Image-relative path under the configured image root (`Emage:ImageRoot`).
            `..` and absolute paths are rejected. Empty value addresses the root.
        - name: X-Emage-Layers
          in: header
          required: false
          schema:
            type: string
            example: "0:1"
          description: Layer window `n:m`, single layer `n`, `all`, or `meta`. Defaults to `all`.
      responses:
        "200":
          description: >-
            Layer-window slice as `image/jp2`. Includes main-headers only when the
            window starts at layer 0.
          headers:
            X-Emage-Framing:
              schema:
                type: string
                enum: ["headers+packets", "packets"]
              description: headers+packets when the window starts at layer 0, else raw packets only.
            X-Emage-Layers:
              schema:
                type: string
              description: Requested window as served, `<n>:<m>`.
            X-Emage-TotalLayers:
              schema:
                type: integer
              description: Number of layers in the full codestream.
            X-Emage-RemainingLayers:
              schema:
                type: integer
              description: Layers still outstanding after `m` (`TotalLayers - m - 1`).
            X-Emage-TilePsotOffsets:
              schema:
                type: string
              description: >-
                Comma-separated byte offsets of every tile-part's SOT Psot field
                within the response body. Present only when headers are included.
          content:
            image/jp2:
              schema:
                type: string
                format: binary
        "200-meta":
          $ref: "#/components/responses/Meta"
        "400":
          description: Invalid `X-Emage-Layers` value or unsupported codestream (e.g. POC, no PLT, non-LRCP mid-window).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: uploadImage
      summary: Upload the full JPEG 2000 codestream.
      description: |
        Stores the uploaded bytes as `<path>` under the image root. Requires a
        password matching `Emage:UploadPassword`; the endpoint is always
        unauthorized when no password is configured. The uploaded body must be a
        complete codestream ending with `0xFF 0xD9` (EOC) that parses cleanly —
        layer slices are rejected. The file is immediately retrievable via GET
        `/image/{path}`.
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Destination path under the image root.
        - name: X-Emage-Password
          in: header
          required: true
          schema:
            type: string
          description: Upload password (must equal `Emage:UploadPassword`).
      requestBody:
        required: true
        content:
          image/jp2:
            schema:
              type: string
              format: binary
      responses:
        "200":
          $ref: "#/components/responses/Uploaded"
        "401":
          description: Missing, empty, or wrong `X-Emage-Password`, or no password configured on the server.
        "400":
          description: Invalid path, empty body, missing EOC (not a full image), or unparseable codestream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteImage
      summary: Delete an image.
      description: |
        Removes `<path>` from the image root and drops its cached index. Requires
        a password matching `Emage:UploadPassword`; always unauthorized when no
        password is configured.
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Image-relative path under the image root.
        - name: X-Emage-Password
          in: header
          required: true
          schema:
            type: string
          description: Upload password (must equal `Emage:UploadPassword`).
      responses:
        "200":
          description: Image deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: string
        "401":
          description: Missing, empty, or wrong `X-Emage-Password`, or no password configured on the server.
        "400":
          description: Invalid image path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /image-info/{path}:
    get:
      operationId: getImageInfo
      summary: Full codestream metadata.
      description: Detailed marker-derived metadata for an image. Works even for PLT-less or otherwise non-sliceable streams.
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Image-relative path under the image root.
      responses:
        "200":
          description: Metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageInfoResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /images:
    get:
      operationId: listImages
      summary: List files under the image root.
      description: |
        Lists every file stored under the image root, sorted by path, including
        parsed metadata (layers, width, height) when the file parses as a JPEG
        2000 codestream.
      responses:
        "200":
          description: Array of stored files.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [path, bytes]
                  properties:
                    path:
                      type: string
                      description: Path relative to the image root.
                    bytes:
                      type: integer
                      description: Stored file length in bytes.
                    layers:
                      type: integer
                      description: |
                        Number of DWT resolution levels in the codestream, i.e. the number of
                        progressively addressable spatial levels. Level 0 is the coarsest
                        approximation (as few as one pixel) and each further level doubles the
                        linear resolution, so level `layers - 1` is full resolution. This project
                        does not use JPEG 2000 quality layers, so this is the only progression axis.
                    width:
                      type: integer
                    height:
                      type: integer
components:
  responses:
    Meta:
      description: Metadata for the image.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MetaResponse"
    Uploaded:
      description: Upload accepted and stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadResponse"
    NotFound:
      description: No such image, or the file is not a supported JPEG 2000 codestream.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: true
      description: Plain-text error message body (may be a JSON string or free text).
    MetaResponse:
      type: object
      required: [layers, width, height, bytes]
      properties:
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Opaque caller metadata from an EMAGE-META binary COM marker in the image main header, or null when absent. No encryption state is inferred by the server.
        layers:
          type: integer
          description: >-
            Number of DWT decomposition levels, so the deepest legal reduced
            decode is `layers - 1`. This project does not use JPEG 2000 quality
            layers, so `layers` counts resolution levels and is the only
            progression axis the server reports.
        width:
          type: integer
        height:
          type: integer
        bytes:
          type: integer
          description: Length of the stored file in bytes.
    UploadResponse:
      type: object
      required: [stored, layers, width, height, bytes]
      properties:
        metadata:
          type: [object, "null"]
          additionalProperties: true
          description: Opaque caller metadata from an EMAGE-META binary COM marker in the image main header, or null when absent. No encryption state is inferred by the server.
        stored:
          type: string
          description: Path the codestream was stored at, relative to the image root.
        layers:
          type: integer
        width:
          type: integer
        height:
          type: integer
        bytes:
          type: integer
    ImageInfoResponse:
      type: object
      required:
        [width, height, components, tileSize, tiles, layers,
         progression, scod, sop, eph, pltDebug, packets, packetsPerLayer, bytes, packetsByLayer]
      properties:
        width:
          type: integer
        height:
          type: integer
        components:
          type: array
          items:
            type: object
            required: [precision, dx, dy]
            properties:
              precision:
                type: integer
                description: Bit precision.
              dx:
                type: integer
                description: Horizontal subsampling.
              dy:
                type: integer
                description: Vertical subsampling.
        tileSize:
          type: object
          required: [width, height]
          properties:
            width:
              type: integer
            height:
              type: integer
        tiles:
          type: integer
          description: Number of distinct tiles.
        layers:
          type: integer
          description: DWT resolution level count (quality layers are unused).
        progression:
          type: string
          enum: [Lrcp, Rlcp, Rpcl, Pcrl, Cprl]
        scod:
          type: integer
          description: Raw Scod byte (coding style; bit 0x02 = tile-part COD present).
        sop:
          type: boolean
          description: Whether SOP/EPH markers are present.
        eph:
          type: boolean
        pltDebug:
          type: boolean
          description: Whether a PLT marker is present (required for layer slicing).
        packets:
          type: integer
          description: Total packets across all tile parts.
        packetsPerLayer:
          type: integer
        bytes:
          type: integer
          description: Stored file length in bytes.
        packetsByLayer:
          type: array
          items:
            type: object
            required: [layer, size]
            properties:
              layer:
                type: integer
              size:
                type: integer
                description: Total bytes of that layer's packets.